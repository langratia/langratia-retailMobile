<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Emerald Shield Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Luxury Card Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Neon Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10B981" stroke-width="4" opacity="0.25" filter="url(#neonGlow)" />

  <!-- Rotated Diamond Shield Frame -->
  <g transform="translate(256, 256) rotate(45)">
    <rect x="-110" y="-110" width="220" height="220" rx="44" fill="#D1FAE5" stroke="url(#emeraldGrad)" stroke-width="12" />
    
    <!-- Inner Counter-Rotated Monogram Box -->
    <g transform="rotate(-45)">
      <!-- 'I' Letter -->
      <text x="-65" y="42" font-family="System, sans-serif" font-size="110" font-weight="900" fill="#10B981">I</text>
      <!-- 'E' Letter -->
      <text x="-15" y="42" font-family="System, sans-serif" font-size="110" font-weight="900" fill="#0F172A">E</text>
    </g>
  </g>

  <!-- Electric Power Crown Badge -->
  <circle cx="365" cy="145" r="32" fill="#10B981" stroke="#FFFFFF" stroke-width="5" />
  <path d="M365 125 L352 148 H366 L363 167 L378 142 H364 Z" fill="#FFFFFF" />

  <!-- Brand Title -->
  <text x="256" y="450" font-family="System, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">IVAN A.K.A ELECTRONICS</text>
</svg>
