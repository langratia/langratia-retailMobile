<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IVAN A.K.A Electronics - Official Logo Preview</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0F172A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .logo-card {
      background: #1E293B;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 400px;
    }
    svg {
      width: 260px;
      height: 260px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 0 0 8px 0;
      color: #FFFFFF;
    }
    p {
      font-size: 13px;
      color: #10B981;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="logo-card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0F172A" />
          <stop offset="100%" stop-color="#1E293B" />
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#10B981" />
          <stop offset="100%" stop-color="#059669" />
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
      <circle cx="256" cy="256" r="180" fill="none" stroke="#10B981" stroke-width="6" opacity="0.3" />
      <g transform="translate(256, 256) rotate(45)">
        <rect x="-110" y="-110" width="220" height="220" rx="44" fill="#ECFDF5" stroke="url(#emeraldGrad)" stroke-width="14" />
        <g transform="rotate(-45)">
          <text x="-65" y="42" font-family="sans-serif" font-size="110" font-weight="900" fill="#10B981">I</text>
          <text x="-15" y="42" font-family="sans-serif" font-size="110" font-weight="900" fill="#0F172A">E</text>
        </g>
      </g>
      <circle cx="365" cy="145" r="32" fill="#10B981" stroke="#FFFFFF" stroke-width="5" />
      <path d="M365 125 L352 148 H366 L363 167 L378 142 H364 Z" fill="#FFFFFF" />
    </svg>
    <h1>IVAN A.K.A ELECTRONICS</h1>
    <p>RETAIL & ELECTRONICS SYSTEM</p>
  </div>
</body>
</html>
